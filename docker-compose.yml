services:
  # Development environment - interactive shell
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ionet-dev:latest
    container_name: ionet-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Build the project
  build:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    image: ionet-build:latest
    container_name: ionet-build
    volumes:
      - .:/workspace
    working_dir: /workspace  
    command: sh -c "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CACHEFILE_DIR=/workspace/.cache && cmake --build build --config Release -- -j$(nproc)"  

  # Run tests
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ionet-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sh -c "cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build && cd build && ctest --output-on-failure -V"

  # Run tests with coverage
  coverage:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ionet-coverage:latest
    container_name: ionet-coverage
    volumes:
      - .:/workspace
      - ./coverage:/workspace/coverage
    working_dir: /workspace
    command: >
      sh -c "
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='--coverage' -DCMAKE_EXE_LINKER_FLAGS='--coverage' &&
        cmake --build build &&
        cd build &&
        ctest --output-on-failure &&
        lcov --base-directory /workspace --capture --directory . --output-file coverage.info --ignore-errors source --ignore-errors gcov &&
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/Catch2/*' --output-file coverage.info --ignore-errors unused &&
        genhtml coverage.info --output-directory /workspace/coverage --synthesize-missing --ignore-errors source
      "

  # Run the 2heartbeats example
  example:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    image: ionet-build:latest
    container_name: ionet-example
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      sh -c "
        ./build/examples/2heartbeats 1001 127.0.0.1 8080 8080 schemas/heartbeat_processes.yaml
      "
    depends_on:
      - build

volumes:
  build-cache: